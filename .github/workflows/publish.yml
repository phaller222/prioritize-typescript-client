# Publish the client to npm when a release tag is pushed.
#
# Authentication uses npm Trusted Publishing (OpenID Connect): GitHub mints a
# short-lived credential for this exact repository and workflow, and npm
# verifies it. No NODE_AUTH_TOKEN, no granular token on the network share, and
# nothing that expires. The publisher must be registered once in the npm package
# settings (see README, "Releasing"). Trusted publishing also satisfies the 2FA
# requirement, so no "bypass 2FA" token is needed any more, and npm attaches a
# provenance attestation automatically.
name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment name registered with the npm trusted publisher.
    environment: npm
    permissions:
      # Required for Trusted Publishing; this is what replaces the npm token.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with the Node
      # runner image is usually older.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      - name: Check tag against package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag=$tag_version package.json=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $pkg_version in package.json"
            exit 1
          fi

      # package-lock.json is deliberately not committed (the generator rewrites
      # package.json), so this is `npm install`, not `npm ci`.
      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Publish
        run: npm publish
